<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Witness AI — Agent Orchestration</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #FAFAF8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Subtle dot grid */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: radial-gradient(circle, #D8D8D4 1px, transparent 1px);
            background-size: 28px 28px;
            pointer-events: none;
            opacity: 0.55;
        }

        /* ── Header ── */
        .header {
            text-align: center;
            margin-bottom: 36px;
            position: relative; z-index: 10;
        }
        .eyebrow {
            display: inline-flex; align-items: center; gap: 7px;
            font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
            text-transform: uppercase; color: #FF5C1B; margin-bottom: 10px;
        }
        .eyebrow-dot { width: 5px; height: 5px; border-radius: 50%; background: #FF5C1B; }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px; font-weight: 600; letter-spacing: -0.02em;
            color: #120B0B; line-height: 1.2;
        }
        h1 em { font-style: italic; color: #FF5C1B; }

        /* ── Scene ── */
        .scene {
            position: relative;
            width: 780px;
            height: 520px;
            z-index: 1;
        }

        .scene-svg {
            position: absolute;
            inset: 0; width: 100%; height: 100%;
            overflow: visible;
        }

        /* ── Diamond tile ── */
        .tile {
            position: absolute;
            z-index: 5;
        }

        .diamond {
            border-radius: 16px;
            transform: rotate(45deg);
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .tile:hover .diamond { transform: rotate(45deg) translateY(-5px); }

        /* Soft layered shadow for depth */
        .diamond::after {
            content: '';
            position: absolute; inset: 0;
            border-radius: 16px;
            box-shadow:
                5px 5px 0 rgba(0,0,0,0.05),
                10px 10px 0 rgba(0,0,0,0.03),
                15px 15px 0 rgba(0,0,0,0.015);
        }

        /* Content (counter-rotated) */
        .diamond-inner {
            position: absolute; inset: 0;
            transform: rotate(-45deg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            border-radius: 16px;
            overflow: hidden;
            z-index: 2;
        }

        .tile-icon {
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px;
            margin-bottom: 2px;
        }

        .tile-name {
            font-size: 9px; font-weight: 700;
            letter-spacing: 0.10em; text-transform: uppercase;
        }

        .tile-sub {
            font-size: 8px; font-weight: 500;
            letter-spacing: 0.03em;
            color: #999490;
        }

        /* ── All tiles same size ── */
        .tile-center .diamond {
            width: 155px; height: 155px;
            background: linear-gradient(145deg, #FFF4EE, #FFEADC);
            border: 1.5px solid rgba(255,92,27,0.22);
            box-shadow: 0 0 0 8px rgba(255,92,27,0.07), 0 4px 20px rgba(255,92,27,0.10);
        }

        .tile-agent .diamond {
            width: 155px; height: 155px;
            background: #FFFFFF;
            border: 1.5px solid #EAEAE6;
            box-shadow: 0 2px 14px rgba(0,0,0,0.05);
        }

        /* ── Footer ── */
        .footer {
            margin-top: 28px;
            font-size: 10px; color: #C8C8C4;
            letter-spacing: 0.06em; text-transform: uppercase;
            position: relative; z-index: 10;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="eyebrow"><span class="eyebrow-dot"></span>System Architecture</div>
        <h1>Witness <em>Agent</em> Orchestration</h1>
    </div>

    <div class="scene">

        <!-- SVG: static connectors only -->
        <svg class="scene-svg" viewBox="0 0 780 520">
            <defs>
                <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="4.5" refY="2.5" orient="auto">
                    <path d="M0,0 L0,5 L7,2.5 z" fill="#FF5C1B" opacity="0.7"/>
                </marker>
            </defs>

            <!-- Outer dashed ring -->
            <path d="M 208 100 Q 390 38, 572 100 Q 670 180, 620 408 Q 390 488, 160 408 Q 110 180, 208 100"
                  fill="none" stroke="#FFD000" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.4"/>

            <!-- Center → NW  (cx:390,cy:280 → cx:218,cy:155) -->
            <line x1="352" y1="242" x2="280" y2="200" stroke="#FF5C1B" stroke-width="1.4" opacity="0.5" marker-end="url(#arr-orange)"/>
            <!-- Center → NE  (cx:390,cy:280 → cx:562,cy:155) -->
            <line x1="428" y1="242" x2="500" y2="200" stroke="#FF5C1B" stroke-width="1.4" opacity="0.5" marker-end="url(#arr-orange)"/>
            <!-- Center → SW  (cx:390,cy:280 → cx:218,cy:365) -->
            <line x1="352" y1="318" x2="280" y2="358" stroke="#FF5C1B" stroke-width="1.4" opacity="0.5" marker-end="url(#arr-orange)"/>
            <!-- Center → SE  (cx:390,cy:280 → cx:562,cy:365) -->
            <line x1="428" y1="318" x2="500" y2="358" stroke="#FF5C1B" stroke-width="1.4" opacity="0.5" marker-end="url(#arr-orange)"/>
        </svg>

        <!-- Central: Witness AI — cx=390, cy=280 → left=312, top=202 -->
        <div class="tile tile-center" style="left:312px; top:202px;">
            <div class="diamond">
                <div class="diamond-inner">
                    <div class="tile-icon" style="width:40px;height:40px;background:rgba(255,92,27,0.10);border:1.5px solid rgba(255,92,27,0.22);">
                        <svg width="22" height="22" viewBox="0 0 18 18" fill="none">
                            <mask id="cm" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="2" y="2" width="14" height="14">
                                <rect x="2" y="2" width="14" height="14" fill="#D9D9D9"/>
                            </mask>
                            <g mask="url(#cm)">
                                <path d="M6.03 9.51C5.88 9.66 5.7 9.74 5.5 9.74H3.28C3.08 9.74 2.9 9.66 2.75 9.51C2.6 9.36 2.53 9.18 2.53 8.98C2.53 8.78 2.6 8.6 2.75 8.45C2.9 8.3 3.08 8.22 3.28 8.22H5.5C5.7 8.22 5.88 8.3 6.03 8.45C6.18 8.6 6.25 8.78 6.25 8.98C6.25 9.18 6.18 9.36 6.03 9.51ZM8.27 5.5V3.28C8.27 3.08 8.35 2.9 8.5 2.75C8.65 2.6 8.83 2.53 9.03 2.53C9.23 2.53 9.41 2.6 9.56 2.75C9.71 2.9 9.78 3.08 9.78 3.28V5.5C9.78 5.7 9.71 5.88 9.56 6.03C9.41 6.18 9.23 6.25 9.03 6.25C8.83 6.25 8.65 6.18 8.5 6.03C8.35 5.88 8.27 5.7 8.27 5.5ZM11.99 8.45C12.14 8.3 12.32 8.22 12.52 8.22H14.74C14.94 8.22 15.12 8.3 15.27 8.45C15.42 8.6 15.49 8.78 15.49 8.98C15.49 9.18 15.42 9.36 15.27 9.51C15.12 9.66 14.94 9.74 14.74 9.74H12.52C12.32 9.74 12.14 9.66 11.99 9.51C11.84 9.36 11.76 9.18 11.76 8.98C11.76 8.78 11.84 8.6 11.99 8.45ZM7.74 10.24C7.39 9.89 7.22 9.47 7.22 8.98C7.22 8.49 7.39 8.07 7.74 7.72C8.09 7.37 8.51 7.2 9 7.2C9.49 7.2 9.91 7.37 10.26 7.72C10.61 8.07 10.78 8.49 10.78 8.98C10.78 9.47 10.61 9.89 10.26 10.24C9.91 10.59 9.49 10.76 9 10.76C8.51 10.76 8.09 10.59 7.74 10.24ZM9.56 11.97C9.71 12.12 9.78 12.3 9.78 12.5V14.72C9.78 14.92 9.71 15.1 9.56 15.25C9.41 15.4 9.23 15.47 9.03 15.47C8.83 15.47 8.65 15.4 8.5 15.25C8.35 15.1 8.27 14.92 8.27 14.72V12.5C8.27 12.3 8.35 12.12 8.5 11.97C8.65 11.82 8.83 11.74 9.03 11.74C9.23 11.74 9.41 11.82 9.56 11.97Z" fill="url(#og)"/>
                            </g>
                            <defs>
                                <linearGradient id="og" x1="2.5" y1="2.5" x2="16" y2="10" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#FFD000"/><stop offset="1" stop-color="#FF5C1B"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <div class="tile-name" style="color:#FF5C1B;">Witness AI</div>
                    <div class="tile-sub" style="color:#C44510;font-weight:600;">Orchestrator</div>
                </div>
            </div>
        </div>

        <!-- NW: Monitor — cx=218, cy=155 → left=140, top=77 -->
        <div class="tile tile-agent t-nw" style="left:140px; top:77px;">
            <div class="diamond" style="width:155px;height:155px;">
                <div class="diamond-inner">
                    <div class="tile-icon" style="width:32px;height:32px;background:#F0FDFB;border:1.5px solid #CCFBF1;">
                        <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
                            <circle cx="9" cy="9" r="3" stroke="#0D9488" stroke-width="1.4"/>
                            <circle cx="9" cy="9" r="5.5" stroke="#0D9488" stroke-width="1" stroke-dasharray="2.5 2" opacity="0.5"/>
                            <circle cx="9" cy="9" r="7.5" stroke="#0D9488" stroke-width="0.7" opacity="0.2"/>
                        </svg>
                    </div>
                    <div class="tile-name" style="color:#0D9488;">Monitor</div>
                    <div class="tile-sub">Watches 24/7</div>
                </div>
            </div>
        </div>

        <!-- NE: Risk Agent — cx=562, cy=155 → left=484, top=77 -->
        <div class="tile tile-agent t-ne" style="left:484px; top:77px;">
            <div class="diamond" style="width:155px;height:155px;">
                <div class="diamond-inner">
                    <div class="tile-icon" style="width:32px;height:32px;background:#FFF7ED;border:1.5px solid #FED7AA;">
                        <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
                            <path d="M9 2.5L15.5 5.5V9.5C15.5 12.8 12.7 15.7 9 16.5C5.3 15.7 2.5 12.8 2.5 9.5V5.5L9 2.5Z" stroke="#EA580C" stroke-width="1.4" stroke-linejoin="round"/>
                            <path d="M9 7V10M9 12V12.5" stroke="#EA580C" stroke-width="1.3" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div class="tile-name" style="color:#EA580C;">Risk Agent</div>
                    <div class="tile-sub">Flags anomalies</div>
                </div>
            </div>
        </div>

        <!-- SW: Memory — cx=218, cy=365 → left=140, top=287 -->
        <div class="tile tile-agent t-sw" style="left:140px; top:287px;">
            <div class="diamond" style="width:155px;height:155px;">
                <div class="diamond-inner">
                    <div class="tile-icon" style="width:32px;height:32px;background:#FAF5FF;border:1.5px solid #E9D5FF;">
                        <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
                            <rect x="2.5" y="4.5" width="13" height="9" rx="2" stroke="#9333EA" stroke-width="1.4"/>
                            <path d="M6 4.5V3M9 4.5V3M12 4.5V3" stroke="#9333EA" stroke-width="1.1" stroke-linecap="round"/>
                            <circle cx="6" cy="9" r="1.1" fill="#9333EA" opacity="0.6"/>
                            <circle cx="9" cy="9" r="1.1" fill="#9333EA"/>
                            <circle cx="12" cy="9" r="1.1" fill="#9333EA" opacity="0.6"/>
                        </svg>
                    </div>
                    <div class="tile-name" style="color:#9333EA;">Memory</div>
                    <div class="tile-sub">Learns & adapts</div>
                </div>
            </div>
        </div>

        <!-- SE: Draft Agent — cx=562, cy=365 → left=484, top=287 -->
        <div class="tile tile-agent t-se" style="left:484px; top:287px;">
            <div class="diamond" style="width:155px;height:155px;">
                <div class="diamond-inner">
                    <div class="tile-icon" style="width:32px;height:32px;background:#EFF6FF;border:1.5px solid #BFDBFE;">
                        <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
                            <rect x="3" y="2.5" width="11" height="13" rx="2" stroke="#2563EB" stroke-width="1.4"/>
                            <path d="M6 6.5h6M6 9h6M6 11.5h4" stroke="#2563EB" stroke-width="1.1" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div class="tile-name" style="color:#2563EB;">Draft Agent</div>
                    <div class="tile-sub">Prepares actions</div>
                </div>
            </div>
        </div>

    </div>

    <div class="footer">Witness AI · HCDE Capstone · University of Washington</div>

</body>
</html>
