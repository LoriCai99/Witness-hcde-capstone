<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Witness — You're all set</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #F4F4F4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Ambient background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 65% 55% at 50% 10%, rgba(255,208,0,0.09) 0%, transparent 65%),
                radial-gradient(ellipse 40% 45% at 12% 88%, rgba(21,93,252,0.04) 0%, transparent 60%),
                radial-gradient(ellipse 40% 45% at 88% 82%, rgba(255,92,27,0.06) 0%, transparent 55%);
            pointer-events: none;
            z-index: 0;
        }

        header, main { position: relative; z-index: 1; }

        /* ─── Animations ─── */
        @keyframes logoIn {
            from { opacity: 0; transform: scale(0.94) translateY(8px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes breathe {
            0%, 100% {
                filter:
                    drop-shadow(0 2px 4px rgba(0,0,0,0.06))
                    drop-shadow(0 8px 24px rgba(0,0,0,0.09));
            }
            50% {
                filter:
                    drop-shadow(0 2px 4px rgba(0,0,0,0.04))
                    drop-shadow(0 10px 36px rgba(255,140,0,0.16))
                    drop-shadow(0 22px 54px rgba(255,92,27,0.09));
            }
        }
        @keyframes spotIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.5; transform: scale(0.8); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ─── Header ─── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 52px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 130px;
        }
        .logo-name {
            font-size: 15px;
            font-weight: 500;
            color: #120B0B;
            letter-spacing: -0.01em;
        }

        /* ─── Progress ─── */
        .progress-system { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .progress-phases { display: flex; align-items: center; }
        .phase { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .phase-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #ADADAD;
        }
        .phase-label.active-phase { color: #FF5C1B; }
        .phase-dots { display: flex; gap: 6px; align-items: center; width: 76px; justify-content: center; }
        .dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            background-color: #BEBEBE;
        }
        .dot.done { background: rgba(255,92,27,0.35); }
        .dot.active {
            background: #FF5C1B;
            width: 28px; border-radius: 5px;
        }
        .phase-divider { width: 20px; height: 1.5px; background-color: #BEBEBE; margin: 0 8px; flex-shrink: 0; }
        .step-counter { min-width: 130px; display: flex; justify-content: flex-end; }
        .step-counter span { font-size: 11px; font-weight: 500; color: #ADADAD; letter-spacing: 0.06em; text-transform: uppercase; }

        /* ─── Main ─── */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 72px;
        }

        .center-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 0;
            position: relative;
        }

        /* Warm spotlight behind logo */
        .spotlight {
            position: absolute;
            width: 560px;
            height: 320px;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: radial-gradient(
                ellipse at 50% 50%,
                rgba(255,208,0,0.10) 0%,
                rgba(255,130,30,0.055) 38%,
                transparent 68%
            );
            pointer-events: none;
            opacity: 0;
            animation: spotIn 2s ease 0.4s forwards;
        }

        /* Animated logo lockup */
        .witness-logo-animated {
            position: relative;
            z-index: 1;
            opacity: 0;
            animation:
                logoIn 0.85s cubic-bezier(0.2, 0, 0, 1) 0.5s forwards,
                breathe 3.5s ease-in-out 1.6s infinite;
            margin-bottom: 52px;
        }

        /* Spinning sun group */
        #sun-anim {
            transform-origin: 16px 16px;
            animation: spin 12s linear infinite;
        }

        /* Heading */
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 52px;
            font-weight: 500;
            color: #120B0B;
            line-height: 1.1;
            letter-spacing: -0.022em;
            margin-bottom: 40px;
            min-height: 1.1em;
        }

        h1 em { font-style: italic; color: #FF5C1B; }

        /* Blinking cursor shown only while typing */
        h1.typing::after {
            content: '|';
            display: inline-block;
            color: #FF5C1B;
            margin-left: 2px;
            animation: cursorBlink 0.7s step-end infinite;
            font-weight: 300;
        }

        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }

        .subtext {
            font-size: 15px;
            color: #45556C;
            line-height: 1.65;
            max-width: 400px;
            margin-bottom: 40px;
            opacity: 0;
            transition: opacity 0.7s ease, transform 0.7s ease;
            transform: translateY(12px);
        }

        .subtext.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* CTA */
        .cta-row {
            display: flex;
            align-items: center;
            gap: 20px;
            opacity: 0;
            transition: opacity 0.7s ease;
        }
        .cta-row.visible { opacity: 1; }

        .btn-start {
            background: #120B0B;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px 36px;
            font-size: 15px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            letter-spacing: -0.01em;
            transition: background 0.2s ease, transform 0.15s ease;
        }
        .btn-start:hover {
            background: #FF5C1B;
            transform: translateY(-1px);
        }

        .btn-prev {
            font-size: 13px;
            color: #ADADAD;
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            transition: color 0.15s;
        }
        .btn-prev:hover {
            color: #45556C;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
    </style>
</head>

            <h1 id="headline" class="typing"></h1>

            <p class="subtext" id="subtext">You've learned how Witness helps. Now we'll connect your tools and customise how much support you want.</p>

            <div class="cta-row" id="btn-start">
                <button class="btn-prev" onclick="window.location.href='screen-3.1.html'">← Previous</button>

    </main>

    <script>
        // ── Ray breathing animation ──────────────────────────
        const INNER   = 11.1;
        const H_LONG  = 6.6;
        const H_SHORT = 2.8;
        const PERIOD  = 2500;

        const longRays  = [...document.querySelectorAll('.ray-long')];
        const shortRays = [...document.querySelectorAll('.ray-short')];

        function tick() {
            const phase = (Math.sin(2 * Math.PI * Date.now() / PERIOD) + 1) / 2;
            const hLong  = H_SHORT + phase * (H_LONG  - H_SHORT);
            const hShort = H_LONG  - phase * (H_LONG  - H_SHORT);
            longRays.forEach(r => { r.setAttribute('height', hLong);  r.setAttribute('y', INNER - hLong); });
            shortRays.forEach(r => { r.setAttribute('height', hShort); r.setAttribute('y', INNER - hShort); });
            requestAnimationFrame(tick);
        }
        tick();

        // ── Typewriter ────────────────────────────────────────
        const PLAIN  = "Let's learn about ";
        const ITALIC = "you";
        const TAIL   = "!";
        const FULL_TEXT = PLAIN + ITALIC + TAIL;

        const TYPE_SPEED = 52;
        const TYPE_DELAY = 1500;

        const headline = document.getElementById('headline');
        const subtext  = document.getElementById('subtext');

        const italicStart = PLAIN.length;
        const italicEnd   = PLAIN.length + ITALIC.length;

        function buildHTML(len) {
            if (len <= italicStart) {
                return FULL_TEXT.slice(0, len);
            } else if (len <= italicEnd) {
                return PLAIN + '<em>' + ITALIC.slice(0, len - italicStart) + '</em>';
            } else {
                return PLAIN + '<em>' + ITALIC + '</em>' + TAIL.slice(0, len - italicEnd);
            }
        }

        let charIndex = 0;

        function typeNext() {
            if (charIndex < FULL_TEXT.length) {
                charIndex++;
                headline.innerHTML = buildHTML(charIndex);
                const jitter = TYPE_SPEED + (Math.random() * 18 - 9);
                setTimeout(typeNext, jitter);
            } else {
                headline.classList.remove('typing');
                setTimeout(() => {
                    subtext.classList.add('visible');
                    setTimeout(() => document.getElementById('btn-start').classList.add('visible'), 180);
                }, 120);
            }
        }

        setTimeout(typeNext, TYPE_DELAY);
    </script>
